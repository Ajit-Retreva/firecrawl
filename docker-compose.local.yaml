# Apply after docker-compose.yaml. No paid providers or cloud credentials.
name: firecrawl-local
services:
  api:
    ports: !override
      - "127.0.0.1:3002:3002"
    environment:
      USE_DB_AUTHENTICATION: "false"
      NUQ_BACKEND: "pg"
      FDB_CLUSTER_FILE: ""
      NUM_WORKERS_PER_QUEUE: "2"
      CRAWL_CONCURRENT_REQUESTS: "3"
      MAX_CONCURRENT_JOBS: "3"
      BROWSER_POOL_SIZE: "3"
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: ""
      OLLAMA_BASE_URL: "http://host.lima.internal:11434/api"
      MODEL_NAME: "qwen2.5:7b"
      MODEL_EMBEDDING_NAME: "nomic-embed-text"
      SEARXNG_ENDPOINT: "http://searxng:8080"
      SEARXNG_ENGINES: "duckduckgo,bing"
      SEARXNG_CATEGORIES: "general"
      BULL_AUTH_KEY: ""
      AUTUMN_SECRET_KEY: ""
      SLACK_WEBHOOK_URL: ""
      SUPABASE_ANON_TOKEN: ""
      SUPABASE_URL: ""
      SUPABASE_SERVICE_TOKEN: ""
    depends_on:
      nuq-postgres:
        condition: service_healthy
    restart: unless-stopped
  playwright-service:
    environment:
      MAX_CONCURRENT_PAGES: "3"
      BLOCK_MEDIA: "false"
      ALLOW_LOCAL_WEBHOOKS: "false"
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: redis-server --bind 0.0.0.0 --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
  rabbitmq:
    hostname: firecrawl-rabbitmq
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
  nuq-postgres:
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  foundationdb:
    profiles: ["foundationdb"]
  foundationdb-init:
    profiles: ["foundationdb"]
  searxng:
    image: searxng/searxng@sha256:f6f67c89efdac7b1bd4805703764ecaa9d0777b86a101b86cae4f1563de4d627
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Run ./local.sh setup first}
    volumes:
      - ./local/searxng.yml:/etc/searxng/settings.yml:ro
    networks: [backend]
    restart: unless-stopped
    mem_limit: 1G
volumes:
  redis-data:
  rabbitmq-data:
  postgres-data:
